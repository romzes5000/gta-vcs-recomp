# The launcher (docs/LAUNCHER.md): built and self-tested on every change to it or the tools it runs, on Windows and on
# Linux (Vulkan through lavapipe, with the validation layer: any message fails the job); on a tag v*, the Windows
# release zip is made (tools/release.py: source, launcher, embeddable Python, the libraries - no game code,
# which only ever exists on a player's PC) and published as a GitHub release.
name: launcher

on:
  push:
    branches: [main]
    paths: ["launcher/**", "tools/**", "src/disc/**", "src/util/sha1.h", ".github/workflows/launcher.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["launcher/**", "tools/**", "src/disc/**", "src/util/sha1.h", ".github/workflows/launcher.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Off until the Linux launcher ships (the user's call, 2026-11-01): releases are Windows only for now. Remove the `if`
  # to build and check it again.
  linux:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # docs/LINUX.md's packages for the launcher; mesa-vulkan-drivers brings lavapipe (no GPU on the runner)
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 cmake ninja-build pkg-config glslang-tools \
            libvulkan-dev libfreetype-dev libfontconfig-dev libx11-dev libxcursor-dev libxrandr-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libdbus-1-dev mesa-vulkan-drivers vulkan-validationlayers fonts-dejavu-core

      - name: Build the launcher
        run: python3 tools/build.py --launcher

      - name: Self-test
        run: |
          ./VCSLauncher --self-test --out "$RUNNER_TEMP/selftest.txt"; code=$?
          cat "$RUNNER_TEMP/selftest.txt"
          exit $code

      # offscreen (no display on the runner), validated: a [vulkan] line is a failure
      - name: Screenshots
        env:
          VCS_LAUNCHER_VK_DEBUG: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          for screen in home gallery setup:disc setup:tools sheet:settings; do
            ./VCSLauncher --screenshot "$RUNNER_TEMP/shots/${screen/:/-}.png" --screen "$screen" 2>&1 | tee -a "$RUNNER_TEMP/shots/log.txt"
          done
          if grep -q '^\[vulkan\]' "$RUNNER_TEMP/shots/log.txt"; then echo "validation messages above"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-linux-screenshots
          path: ${{ runner.temp }}/shots

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the launcher
        run: python tools/build.py --launcher

      # its report outside the checkout: release.py refuses a working tree with untracked files
      - name: Self-test
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $p = Start-Process -FilePath .\VCSLauncher.exe -ArgumentList '--self-test','--out',$out -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { exit 1 }

      # pwsh: `cmd || echo` leaves $LASTEXITCODE at cmd's 1 (echo is a cmdlet), and the runner exits with it
      - name: Tool checks
        shell: pwsh
        run: |
          python tools/doctor.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/deps.py list
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tools/recompile.py --check
          if ($LASTEXITCODE -ne 0) { "no generated code here (expected)" }
          exit 0

      - name: Release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/release.py --ref ${{ github.ref_name }} --launcher VCSLauncher.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem build/dist/*.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName "$($zip.FullName).sha256" `
            --title "${{ github.ref_name }}" --generate-notes
